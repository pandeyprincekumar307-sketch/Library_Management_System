<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Sign In')}"></head>
<body class="bg-light min-vh-100 d-flex flex-column">
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div th:replace="~{fragments/header :: alerts}"></div>

<div class="container d-flex flex-column align-items-center justify-content-center flex-grow-1 py-4">
    <div class="card shadow-sm border-0" style="max-width: 420px; width: 100%;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <span style="font-size: 2.5rem;">📚</span>
                <h3 class="fw-bold mt-2 mb-1">Sign In</h3>
                <p class="text-muted small">Enter your credentials to access Library Manager</p>
            </div>

            <!-- Flash & Error alerts -->
            <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
                Invalid email or password.
            </div>
            <div th:if="${param.logout}" class="alert alert-info py-2 small" role="alert">
                You have been signed out.
            </div>
            <div th:if="${message}" class="alert alert-success py-2 small" role="alert" th:text="${message}"></div>

            <form method="post" th:action="@{/auth/login}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Email Address</label>
                    <input type="email" class="form-control" name="email" placeholder="name@example.com" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Password</label>
                    <input type="password" class="form-control" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Sign In</button>
            </form>

            <hr class="my-4">

            <p class="text-center text-muted small mb-0">
                Don't have an account? <a th:href="@{/auth/register}" class="text-decoration-none fw-semibold">Create account</a>
            </p>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
