<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Books')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div th:replace="~{fragments/header :: alerts}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 class="mb-0">Books</h2>
        <a class="btn btn-primary" th:href="@{/books/new}">+ Add Book</a>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/books}">
        <div class="col-auto flex-grow-1">
            <input type="text" name="q" class="form-control" placeholder="Search by title or author" th:value="${q}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary">Search</button>
        </div>
    </form>

    <div class="card p-0">
        <table class="table table-hover mb-0 align-middle">
            <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Categories</th>
                <th>Availability</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.title}">Title</td>
                <td th:text="${book.author}">Author</td>
                <td>
                    <span class="badge bg-secondary me-1" th:each="c : ${book.categories}" th:text="${c.name}">Cat</span>
                </td>
                <td>
                    <span th:text="${book.availableCopies} + ' / ' + ${book.totalCopies}">0 / 0</span>
                </td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/books/edit/{id}(id=${book.id})}">Edit</a>
                    <a class="btn btn-sm btn-outline-danger" data-confirm="Delete this book?"
                       th:href="@{/books/delete/{id}(id=${book.id})}">Delete</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(books)}">
                <td colspan="6" class="text-center text-muted py-4">No books found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
