<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Borrow Records')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div th:replace="~{fragments/header :: alerts}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 class="mb-0">Borrow / Return</h2>
        <a class="btn btn-primary" th:href="@{/borrow/new}">+ Issue Book</a>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/borrow}">
        <div class="col-auto flex-grow-1">
            <input type="text" name="q" class="form-control" placeholder="Search by name or email" th:value="${q}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary">Search</button>
        </div>
    </form>

    <div class="card p-0">
        <table class="table table-hover mb-0 align-middle">
            <thead>
            <tr>
                <th>Book</th>
                <th>Member</th>
                <th>Issue Date</th>
                <th>Return Date</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${records}">
                <td th:text="${r.book != null ? r.book.title + ' (' + r.book.author + ')':'-'}">Book</td>
                <td th:text="${r.member != null ? r.member.name + ' (' + r.member.email + ')':'-'}">Member</td>
                <td th:text="${r.issueDate != null ? r.issueDate:'-'}">Borrowed</td>
                <td th:text="${r.returnDate != null ? r.returnDate:'-'}">Return</td>
                <td>
                    <span class="badge badge-status-returned" th:if="${r.status.name() == 'RETURNED'}">Returned</span>
                    <span class="badge badge-status-borrowed" th:if="${r.status.name() == 'BORROWED'}">Borrowed</span>
                </td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" th:if="${r.status.name() == 'BORROWED'}" th:href="@{/borrow/return/{id}(id=${r.id})}" data-confirm="Mark this book as returned?">Return</a>
                    <a class="btn btn-sm btn-outline-danger" data-confirm="Delete this book?"
                       th:href="@{/borrow/delete/{id}(id=${r.id})}">Delete</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(records)}">
                <td colspan="6" class="text-center text-muted py-4">No record found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
