<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Change Password')}"></head>
<body class="bg-light min-vh-100 d-flex flex-column">
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div th:replace="~{fragments/header :: alerts}"></div>

<div class="container my-4 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white py-3">
                    <h5 class="mb-0 fw-semibold">🔑 Change Password</h5>
                </div>
                <div class="card-body p-4">

                    <!-- Change Password Form -->
                    <form th:action="@{/profile/change-password}" th:object="${changePasswordDto}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label for="currentPassword" class="form-label fw-semibold">Current Password</label>
                            <input type="password"
                                   id="currentPassword"
                                   th:field="*{currentPassword}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'"
                                   placeholder="Enter your current password"
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="newPassword" class="form-label fw-semibold">New Password</label>
                            <input type="password"
                                   id="newPassword"
                                   th:field="*{newPassword}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                                   placeholder="Enter at least 6 characters"
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label fw-semibold">Confirm New Password</label>
                            <input type="password"
                                   id="confirmPassword"
                                   th:field="*{confirmPassword}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                                   placeholder="Re-enter your new password"
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>

                        <div class="d-flex gap-2 pt-2">
                            <button type="submit" class="btn btn-dark px-4">Update Password</button>
                            <a th:href="@{/profile}" class="btn btn-outline-secondary">Back to Profile</a>
                            <a th:href="@{/}" class="btn btn-light ms-auto">Dashboard</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
