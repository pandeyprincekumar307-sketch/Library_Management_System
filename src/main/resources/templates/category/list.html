<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Categories')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div th:replace="~{fragments/header :: alerts}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 class="mb-0">Categories</h2>
        <a class="btn btn-primary" th:href="@{/categories/new}">+ Add Category</a>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/categories}">
        <div class="col-auto flex-grow-1">
            <input type="text" name="q" class="form-control" placeholder="Search by name" th:value="${q}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary">Search</button>
        </div>
    </form>

    <div class="card p-0">
        <table class="table table-hover mb-0 align-middle">
            <thead>
            <tr>
                <th>Name</th>
                <th># Books</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="category : ${categories}">
                <td th:text="${category.name}">Name</td>
                <td th:text="${#lists.size(category.books)}">0</td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/categories/edit/{id}(id=${category.id})}">Edit</a>
                    <a class="btn btn-sm btn-outline-danger" data-confirm="Delete this category?"
                       th:href="@{/categories/delete/{id}(id=${category.id})}">Delete</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(categories)}">
                <td colspan="6" class="text-center text-muted py-4">No category found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
