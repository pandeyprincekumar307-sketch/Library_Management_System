<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(${member.id} == null ? 'Add Member' : 'Edit Member')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div th:replace="~{fragments/header :: alerts}"></div>

<div class="container">
    <h2 th:text="${member.id} == null ? 'Add Member' : 'Edit Member'">Add Member</h2>

    <div class="card p-4" style="max-width: 640px;">
        <form method="post" th:action="@{/member/save}" th:object="${member}">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="text" class="form-control" th:field="*{email}"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Gender</label>
                <select class="form-select" th:field="*{gender}">
                    <option value="" selected disabled>-- Select --</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <hr/>
            <h3>Address</h3>
            <div class="mb-3">
                <label class="form-label">City</label>
                <input type="text" class="form-control" th:field="*{address.city}" th:classappend="${#fields.hasErrors('address.city')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('address.city')}" th:errors="*{address.city}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">State</label>
                <input type="text" class="form-control" th:field="*{address.state}" th:classappend="${#fields.hasErrors('address.state')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('address.state')}" th:errors="*{address.state}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Pin Code</label>
                <input type="text" class="form-control" th:field="*{address.pinCode}" th:classappend="${#fields.hasErrors('address.pinCode')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('address.pinCode')}" th:errors="*{address.pinCode}"></div>
            </div>

            <button type="submit" class="btn btn-primary">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/member}">Cancel</a>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
