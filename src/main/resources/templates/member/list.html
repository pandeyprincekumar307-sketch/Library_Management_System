<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Members')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div th:replace="~{fragments/header :: alerts}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 class="mb-0">Members</h2>
        <a class="btn btn-primary" th:href="@{/member/new}">+ Add Member</a>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/member}">
        <div class="col-auto flex-grow-1">
            <input type="text" name="q" class="form-control" placeholder="Search by name or email" th:value="${q}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary">Search</button>
        </div>
    </form>

    <div class="card p-0">
        <table class="table table-hover mb-0 align-middle">
            <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Gender</th>
                <th>City</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="member : ${members}">
                <td th:text="${member.name}">Name</td>
                <td th:text="${member.email}">Email</td>
                <td>
                    <span class="badge bg-secondary me-1" th:each="c : ${member.gender}" th:text="${member.gender}"></span>
                </td>
                <td>
                    <span th:text="${member.address.city}">City</span>
                </td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/member/edit/{id}(id=${member.id})}">Edit</a>
                    <a class="btn btn-sm btn-outline-danger" data-confirm="Delete this book?"
                       th:href="@{/member/delete/{id}(id=${member.id})}">Delete</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(members)}">
                <td colspan="6" class="text-center text-muted py-4">No members found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
