spring.application.name=Library_Management_System

# Dynamic Port for Render (uses PORT env variable on cloud, falls back to 8080 locally)
server.port=${PORT:8080}

# Database Configuration (supports Aiven MySQL via environment variables with local fallback)
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/Library_Management_System}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:shivam}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true